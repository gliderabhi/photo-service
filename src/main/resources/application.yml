server:
  port: 0

spring:
  application:
    name: photo-service
  datasource:
    url: jdbc:mysql://localhost:3306/photo_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: sevis
    password: SevisDb@2024
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  servlet:
    multipart:
      # Raised from 20MB/25MB to accommodate video uploads forwarded to stream-service;
      # photo uploads are unaffected by a higher ceiling.
      max-file-size: 2GB
      max-request-size: 2GB

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${random.value}

photo:
  storage:
    base-dir: /mnt/sdb1/photos

face:
  service:
    url: http://localhost:8600

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    root: INFO
    com.sevis: DEBUG
  file:
    name: /home/sevis/projects/local-logs/photo-service.log
